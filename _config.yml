# Site settings
title: MailMouse
description: "Simple group email and mailing lists — a modern alternative to Google Groups. No ads, EU-hosted, GDPR compliant, works with any email provider."
url: "https://mailmouse.co"
baseurl: ""

# GitHub Pages settings
source: .
destination: ./_site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .DS_Store
  - docs/

# Disable theme defaults that might expect docs directory
theme: null
remote_theme: null

# Jekyll settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO tag settings
author: MailMouse Team
twitter:
  username: mailmouse
  card: summary_large_image

# Social media
social:
  name: MailMouse
  links:
    - https://twitter.com/mailmouse